# Default values for cosmos3-reasoner.
# These are overridden by the parent nims chart via alias "cosmos3".
#
# NOTE: This is a staging RC NIM. Mirrors the dev-profile-base
# docker compose (deploy/docker/services/nim/cosmos3-reasoner/compose.yml)
# which is opt-in via VLM_NAME=nvidia/cosmos3-reasoner. Disabled by
# default at the umbrella level.

image:
  repository: nvcr.io/nvstaging/nim/cosmos3-reasoner
  tag: "1.7.1.rc0-51870194"
  pullPolicy: IfNotPresent

replicas: 1

resources:
  limits:
    nvidia.com/gpu: "1"
  requests:
    nvidia.com/gpu: "1"

storage:
  pvc:
    storageClass: ""
    size: "200Gi"
  sharedMemorySizeLimit: "32Gi"

metrics:
  enabled: false

service:
  type: ClusterIP
  port: 8000

tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"

# NIM_MODEL_SIZE selects nano (default) or super model variant baked into
# the staging image. Mirrors the docker compose env knob of the same name.
# NIM_KVCACHE_PERCENT / NIM_PASSTHROUGH_ARGS are populated via the parent
# chart's GPU profile lookup table (gpuProfiles.<gpuType>.cosmos3).
env:
  NIM_MODEL_SIZE: "nano"
  NIM_KVCACHE_PERCENT: ""
  NIM_PASSTHROUGH_ARGS: ""
  NIM_DISABLE_MM_PREPROCESSOR_CACHE: "1"

# Keys to import from <cosmos3-fullname>-nim-env ConfigMap into NIMService.spec.env.
# Missing keys are skipped due to optional: true.
envConfigMapKeys:
  - NIM_KVCACHE_PERCENT
  - NIM_PASSTHROUGH_ARGS
  - NIM_DISABLE_MM_PREPROCESSOR_CACHE

global:
  pullSecretName: "ngc-nim-docker-reg-secret"
  authSecretName: "ngc-nim-api-key-secret"
  storageClass: ""
